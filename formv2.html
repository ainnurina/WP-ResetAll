<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Form to Google Sheet</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        padding: 2rem;
        max-width: 600px;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <h2>Submit Your Data</h2>
    <form id="ExcelForm">
      <div class="form-group">
        <input
          type="text"
          name="name"
          class="form-control"
          placeholder="Name"
          required
        />
      </div>
      <div class="form-group">
        <input
          type="email"
          name="email"
          class="form-control"
          placeholder="Email"
          required
        />
      </div>
      <div class="form-group">
        <input
          type="number"
          name="age"
          class="form-control"
          placeholder="Age"
          required
        />
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <!-- Link to your external JS file -->
    <script src="main.js"></script>
  </body>
</html>
